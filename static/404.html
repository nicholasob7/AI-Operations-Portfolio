<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>404 Not Found</title>
		<style>
			:root {
				color-scheme: light;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family: "Spectral", Georgia, "Times New Roman", serif;
				background: #f4f6fb;
				color: #131925;
			}

			main {
				max-width: 42rem;
				padding: 2rem;
				text-align: center;
			}

			h1 {
				margin: 0 0 0.5rem;
				font-size: clamp(2rem, 4vw, 3rem);
			}

			p {
				margin: 0;
				line-height: 1.5;
				font-size: 1.05rem;
			}

			a {
				color: #0b5ed7;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>404</h1>
			<p>The requested path was not found.</p>
			<p><a href="/">Return to home</a></p>
		</main>
	</body>
</html>
