<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Page not found</title>
		<style>
			@font-face {
				font-family: "Spectral";
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url("/fonts/spectral/spectral-400.woff2") format("woff2");
			}

			@font-face {
				font-family: "Spectral";
				font-style: normal;
				font-weight: 500;
				font-display: swap;
				src: url("/fonts/spectral/spectral-500.woff2") format("woff2");
			}

			@font-face {
				font-family: "Spectral";
				font-style: normal;
				font-weight: 600;
				font-display: swap;
				src: url("/fonts/spectral/spectral-600.woff2") format("woff2");
			}

			:root {
				color-scheme: dark;
				--bg-0: #060912;
				--bg-1: #0b1326;
				--text-main: #dbe8fb;
				--text-muted: #afbdd8;
				--panel-bg: rgba(11, 19, 38, 0.8);
				--panel-border: rgba(154, 99, 232, 0.24);
				--link-start: #35598f;
				--link-mid: #4f4685;
				--link-end: #2a7167;
				--link-start-hover: #446ca9;
				--link-mid-hover: #6458a0;
				--link-end-hover: #358879;
			}

			*,
			::before,
			::after {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
			}

			html {
				background-color: var(--bg-0);
			}

			body {
				min-height: 100vh;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1.4rem;
				font-family: "Spectral", Georgia, "Times New Roman", serif;
				color: var(--text-main);
				background:
					radial-gradient(circle at 10% 10%, rgba(47, 209, 255, 0.12) 0%, transparent 25%),
					radial-gradient(circle at 75% 12%, rgba(110, 63, 177, 0.24) 0%, transparent 24%),
					radial-gradient(circle at 90% 18%, rgba(30, 141, 106, 0.18) 0%, transparent 24%),
					linear-gradient(170deg, var(--bg-0) 0%, var(--bg-1) 100%);
			}

			main {
				width: min(42rem, 100%);
				padding: clamp(1.35rem, 2.5vw, 2rem);
				border: 1px solid var(--panel-border);
				border-radius: 1.2rem;
				background: var(--panel-bg);
				box-shadow:
					0 18px 48px rgba(0, 0, 0, 0.45),
					inset 0 1px 0 rgba(255, 255, 255, 0.04);
				backdrop-filter: blur(5px);
			}

			h1 {
				margin: 0;
				font-size: clamp(1.8rem, 5vw, 2.35rem);
				line-height: 1.2;
				font-weight: 600;
			}

			p {
				margin: 0.9rem 0 0;
				line-height: 1.55;
				font-size: 1.04rem;
				color: var(--text-muted);
			}

			nav {
				margin-top: 1.4rem;
			}

			ul {
				list-style: none;
				margin: 0;
				padding: 0;
				display: grid;
				gap: 0.65rem;
			}

			a {
				display: block;
				padding: 0.68rem 0.85rem;
				border-radius: 0.82rem;
				border: 1px solid rgba(143, 184, 236, 0.24);
				background: linear-gradient(
					120deg,
					var(--link-start) 0%,
					var(--link-mid) 50%,
					var(--link-end) 100%
				);
				color: #e8f4ff;
				text-decoration: none;
				font-size: 1rem;
				font-weight: 500;
				line-height: 1.3;
				transition: background-color 120ms ease;
			}

			a:hover,
			a:focus-visible {
				background: linear-gradient(
					120deg,
					var(--link-start-hover) 0%,
					var(--link-mid-hover) 50%,
					var(--link-end-hover) 100%
				);
			}

			a:focus-visible {
				outline: 2px solid rgba(223, 243, 255, 0.8);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Page not found</h1>
			<p>
				The requested page is not part of the current public site. If you followed an older or
				retired link, use one of the active entry points below.
			</p>
			<nav aria-label="Current entry points">
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="/resumes">Resumes</a></li>
					<li><a href="/highlights">Highlights</a></li>
					<li><a href="/canonical.json">Canonical JSON</a></li>
				</ul>
			</nav>
		</main>
	</body>
</html>
